<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-brand=${brand} ?: 'technologies'" data-brand="technologies" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>Confirm your email · Prabhix</title>
    <link rel="stylesheet" th:href="@{/assets/prabhix-tokens.css}">
    <link rel="stylesheet" th:href="@{/assets/login.css}">
</head>
<body>
<a class="skip-link" href="#heading">Skip to content</a>
<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch colour theme">
    <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
    </svg>
    <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="3.25" stroke="currentColor" stroke-width="1.75"/>
        <path d="M12 3v1.8M12 19.2V21M4.9 4.9l1.3 1.3M17.8 17.8l1.3 1.3M3 12h1.8M19.2 12H21M4.9 19.1l1.3-1.3M17.8 6.2l1.3-1.3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    </svg>
</button>
<div class="stage">
    <aside class="stage-brand" aria-hidden="true">
        <div class="brand-lockup">
            <img class="brand-mark" th:src="@{/assets/prabhix-mark.svg}" width="40" height="40" alt="">
            <p class="brand">Prabhix</p>
        </div>
        <div class="stage-copy">
            <p class="stage-headline">One quick check.<br>Then your shop.</p>
            <p>We verify every new address before an account can sign in.</p>
        </div>
        <p class="stage-foot">Prabhix Technologies</p>
    </aside>
    <main class="shell">
    <section class="card" aria-labelledby="heading">
        <div class="brand-lockup">
            <img class="brand-mark" th:src="@{/assets/prabhix-mark.svg}" width="36" height="36" alt="">
            <p class="brand">Prabhix</p>
        </div>
        <h1 id="heading" tabindex="-1">Check your email</h1>
        <p class="sub">We sent a 6-digit code to <strong th:text="${email}">you@example.com</strong>.</p>

        <p class="alert error" th:if="${error}" th:text="${error}" role="alert"></p>
        <p class="alert notice" th:if="${notice}" th:text="${notice}" role="status"></p>

        <form method="post" th:action="@{/signup/verify}" data-testid="signup-verify-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="code">Verification code</label>
            <input id="code" name="code" type="text" autocomplete="one-time-code"
                   inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6"
                   required autofocus aria-describedby="code-help">
            <p class="hint" id="code-help">The code expires shortly and works once.</p>
            <button type="submit" class="primary">Verify and continue</button>
        </form>

        <form method="post" th:action="@{/signup/resend}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="secondary">Send a new code</button>
        </form>
    </section>
    <p class="footprint">Prabhix Technologies</p>
    </main>
</div>
<script th:src="@{/assets/login.js}"
        th:attr="data-csrf-token=${_csrf.token}, data-csrf-header=${_csrf.headerName}"
        defer></script>
</body>
</html>
