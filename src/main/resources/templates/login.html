<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign in · Prabhix</title>
    <link rel="stylesheet" th:href="@{/assets/login.css}">
</head>
<body>
<main class="shell">
    <div class="card">
        <div class="brand" aria-hidden="true">PA</div>
        <h1>Sign in</h1>
        <p class="sub">One account for every Prabhix product.</p>

        <p class="alert error" th:if="${error}" th:text="${error}" role="alert"></p>
        <p class="alert notice" th:if="${notice}" th:text="${notice}" role="status"></p>

        <form method="post" th:action="@{/login}" novalidate>
            <label for="username">Email address</label>
            <input id="username" name="username" type="email" autocomplete="username"
                   required autofocus inputmode="email">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Continue</button>
        </form>

        <p class="help">
            <!-- Absolute, to the console: password recovery is a product screen already, and a second
                 copy here would be two flows to keep in step. -->
            <a th:href="${forgotPasswordUrl}">Forgotten your password?</a>
        </p>
    </div>
    <p class="footprint">Prabhix Technologies</p>
</main>
</body>
</html>
