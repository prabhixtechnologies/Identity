<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Confirm sign-in · Prabhix</title>
    <link rel="stylesheet" th:href="@{/assets/prabhix-tokens.css}">
    <link rel="stylesheet" th:href="@{/assets/login.css}">
</head>
<body class="login-page">
<main class="login-card" id="heading">
    <img class="brand-mark" th:src="@{/assets/prabhix-mark.svg}" width="40" height="40" alt="">
    <h1>Finish signing in</h1>
    <p class="muted">Continue to Prabhix for <strong th:text="${destination}">you@example.com</strong>.</p>
    <form method="post" th:action="@{/login/link/confirm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="token" th:value="${token}">
        <button type="submit" class="btn btn-primary">Continue</button>
    </form>
    <p class="hint">If you did not request this link, close this page.</p>
</main>
</body>
</html>
