spring:
  application:
    name: prabhix-identity

  profiles:
    default: dev

  jackson:
    default-property-inclusion: non_null
    #
    # Jackson 3 split the feature flags across several enums, and Spring binds each block below to a
    # different one. A key under the wrong block is not ignored: binding fails, so the mapper cannot be
    # built, so the application does not start. Which enum each belongs to is worth stating.
    datatype:
      datetime:
        # DateTimeFeature, moved out of SerializationFeature. Left explicit even though false is now
        # the Jackson default, because ISO-8601 strings rather than epoch numbers is a contract with
        # every relying party, not a preference.
        write-dates-as-timestamps: false
    mapper:
      # MapperFeature, and on by default in Jackson 3, which would reorder the keys of every response
      # including the discovery document and the JWKS. Nothing should read those positionally, but a
      # framework upgrade is not the moment to find out otherwise.
      sort-properties-alphabetically: false
    deserialization:
      fail-on-unknown-properties: false

  # Moved here from server.error.* in the Boot 4 upgrade. The old keys bind to a different enum, so
  # Boot could not carry them across and ignored them in silence — no warning, no failure, just the
  # defaults. They happen to default to never as well, so nothing leaked, but "the safe thing was the
  # default" is luck rather than configuration and only the properties migrator revealed it.
  #
  # never on both, and it matters more here than anywhere: this service handles credentials, so an
  # exception message can quote what was submitted, and a stack trace tells an attacker exactly which
  # authentication path they reached.
  web:
    error:
      include-message: never
      include-stacktrace: never

  datasource:
    # Its own database, not its own schema and not a shared one. The five tables here are the only
    # writer of themselves, and a separate database is what makes "the platform cannot reach into
    # users" a fact about the credentials rather than a convention nobody enforces.
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${IDENTITY_DB_USER:identity}
    password: ${IDENTITY_DB_PASSWORD:identity}
    hikari:
      # Small on purpose. Sign-in traffic is a fraction of API traffic, and the pool competes with
      # the platform's for the same Postgres on a single-instance deployment.
      maximum-pool-size: ${IDENTITY_DB_POOL:10}
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. ddl-auto would let an entity change alter production silently.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Off: this database starts empty, so a baseline would only mask a first migration that failed.
    baseline-on-migrate: false

  data:
    redis:
      # Shared with the platform, deliberately. The deny list is one set of keys that identity writes
      # and every product reads; two Redis instances would mean a revocation only half the fleet saw.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: true
          # Without these a relay that stops answering hangs the request thread until the OS gives
          # up, which at sign-in volumes exhausts the pool long before anyone notices the relay.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  # 8081, because Caddy fronts both this and the platform backend on 8080 as one API origin.
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  # The issuer in a discovery document has to be the public https URL, not the container's own
  # http://identity:8081, so the proxy's X-Forwarded-* headers have to be trusted.
  forward-headers-strategy: framework
  tomcat:
    threads:
      # Identity does not run on virtual threads, unlike the platform backend and MobiStack, so
      # Tomcat holds a real pool of platform threads here. The default ceiling of 200 reserves
      # stack for concurrency a token endpoint will never see, and this process has the smallest
      # memory limit of the four JVMs sharing the box.
      max: ${TOMCAT_MAX_THREADS:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # Identity is the service that *writes* deny-list entries, so an unreachable cache here
        # means a logout or a role change is accepted and silently dropped. Worth failing readiness
        # over rather than discovering later that revocation never worked.
        #
        # The Dockerfile HEALTHCHECK reads this endpoint, which marks the container unhealthy rather
        # than restarting it: plain Docker does not restart on health, only Swarm does.
        readiness:
          include: readinessState,redis

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    root: INFO
    com.prabhix.identity: ${LOG_LEVEL:INFO}

prabhix:
  identity:
    # Goes into every token's iss claim and is the base for the two well-known URLs, so it must be
    # the address clients actually reach — id.prabhixtechnologies.com, not the container hostname.
    # Changing it invalidates every token already issued, since verification requires an exact match.
    issuer: ${IDENTITY_ISSUER:http://localhost:8081}

    token:
      access-token-ttl: ${IDENTITY_ACCESS_TTL:PT15M}
      # Also how long a signed-in browser stays signed in: the session cookie shares this knob.
      refresh-token-ttl: ${IDENTITY_REFRESH_TTL:P30D}

    signing:
      # PKCS#8 PEM. Blank generates a throwaway key, which SigningKeyProvider allows only under a
      # local profile — a restart would otherwise sign every user out.
      #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048
      private-key: ${IDENTITY_SIGNING_KEY:}
      # X.509 PEM public keys that no longer sign but stay in the JWKS for one access-token lifetime
      # after a rotation, so tokens issued just before the switch keep verifying.
      retired-public-keys: ${IDENTITY_RETIRED_PUBLIC_KEYS:}

    password:
      min-length: 10
      # Imported hashes verify at whatever cost they were written with, since bcrypt stores it inside
      # the hash. This only sets the cost of hashes written from now on.
      bcrypt-strength: 12

    lockout:
      max-failed-attempts: 5
      duration: PT15M

    challenge:
      otp-length: 6
      ttl: PT10M
      max-attempts: 5

    session-cookie:
      name: ${SESSION_COOKIE_NAME:pbx_session}
      # The registrable parent domain, so every Prabhix hostname sees the same cookie and one sign-in
      # covers all of them. Empty means host-only, which is right for local development.
      domain: ${SESSION_COOKIE_DOMAIN:}
      secure: ${SESSION_COOKIE_SECURE:true}
      same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

    urls:
      # Console router paths, not API paths — emailed links land in the browser. These drifted apart
      # from the router once and every magic link 404'd.
      console: ${CONSOLE_URL:http://localhost:5173}
      admin: ${ADMIN_URL:http://localhost:5174}

    sso:
      google-client-id: ${GOOGLE_CLIENT_ID:}

    # Outbound SMS for phone sign-in. Blank account SID disables the phone flows entirely, and they
    # then refuse with FEATURE_DISABLED rather than accepting a request and never delivering.
    #
    # For Indian destinations set TWILIO_MESSAGING_SERVICE_SID rather than a bare from-number: DLT
    # sender-id and template registration hang off the messaging service, and without them the carrier
    # drops the message while the API call still returns success. That failure is invisible from here.
    sms:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}

    # First-party OAuth clients, seeded on every boot by RegisteredClientSeeder and updated in place.
    #
    # Redirect URIs are matched for exact equality — never by prefix and never with a wildcard, because
    # a permissive match here is an open redirect and an open redirect on /authorize hands the
    # authorization code to whoever crafted the link. Every URI a product might land on must be listed.
    #
    # No secrets: browser apps and mobile apps cannot keep one. They are public clients secured by
    # PKCE, which is mandatory rather than optional.
    #
    # The Android entries use the app's own scheme, which is how AppAuth receives the redirect back
    # from a Custom Tab. A WebView would not work and must not be used: it has its own cookie jar, so
    # signing in there would not be visible to the other apps and single sign-on would quietly stop
    # being single.
    clients:
      - client-id: prabhix-console
        name: Prabhix OneOps
        redirect-uris:
          - ${CONSOLE_URL:http://localhost:5173}/auth/callback
        post-logout-redirect-uris:
          - ${CONSOLE_URL:http://localhost:5173}/
      - client-id: prabhix-admin
        name: Prabhix Admin
        redirect-uris:
          - ${ADMIN_URL:http://localhost:5174}/auth/callback
        post-logout-redirect-uris:
          - ${ADMIN_URL:http://localhost:5174}/
      - client-id: prabhix-mailroom
        name: Prabhix Mailroom
        redirect-uris:
          - ${MAILROOM_URL:http://localhost:5175}/auth/callback
        post-logout-redirect-uris:
          - ${MAILROOM_URL:http://localhost:5175}/
      # The scheme is the applicationId, which for the OneOps flavor is still `com.prabhix.operator` —
      # what the app was called before the product was named. Renaming the id would publish a second,
      # unrelated app and orphan every phone that already has this one, so it stays.
      #
      # The .debug variants are listed because `applicationIdSuffix = ".debug"` gives debug builds a
      # different scheme, and omitting them means no developer can sign in to a debug build.
      - client-id: prabhix-oneops-android
        name: Prabhix OneOps for Android
        redirect-uris:
          - com.prabhix.operator:/oauth2redirect
          - com.prabhix.operator.debug:/oauth2redirect
      - client-id: prabhix-admin-android
        name: Prabhix Admin for Android
        redirect-uris:
          - com.prabhix.admin:/oauth2redirect
          - com.prabhix.admin.debug:/oauth2redirect
      # A separate client from prabhix-mailroom, which is the web app: the redirect URI is a private-use
      # scheme rather than an https callback, and one client holding both would let a redirect registered
      # for the browser be used by an app and the other way round.
      - client-id: prabhix-mailroom-android
        name: Prabhix Mailroom for Android
        redirect-uris:
          - com.prabhix.mailroom:/oauth2redirect
          - com.prabhix.mailroom.debug:/oauth2redirect

    mail:
      from: ${IDENTITY_MAIL_FROM:security@prabhixtechnologies.com}
      from-name: ${IDENTITY_MAIL_FROM_NAME:Prabhix Technologies}

    # Shared secret a product presents to read user records from /internal. Blank disables the
    # endpoint, which is the right default for a deployment nobody has given one.
    service-token: ${IDENTITY_SERVICE_TOKEN:}

---
# ElastiCache Serverless for Valkey is always cluster mode and always TLS, so the host/port
# settings above cannot reach it. Activate with SPRING_PROFILES_ACTIVE=prod,valkey.
#
# This must point at the same cache as the platform backend, for the reason given on the redis
# block above: the deny list is one keyspace that identity writes and every product reads.
spring:
  config:
    activate:
      on-profile: valkey
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
        max-redirects: 3
      ssl:
        enabled: true
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: 60s
